name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare engine assets
        run: |
          set -ex
          PS4="+ ${BASH_SOURCE}:${LINENO}: "
          mkdir -p app/src/main/assets/engine

          # 1) Native Android ARM64 Node.js from the official Termux repo
          curl -s -o /tmp/Packages \
            https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages

          # resolve nodejs + transitive deps with python (mawk paragraph mode is unreliable)
          python3 - <<'PYEOF' > /tmp/dl_list.txt
          import re
          content = open('/tmp/Packages').read()
          stanzas = {}
          for st in content.split('\n\n'):
              m = re.search(r'^Package: (.+)$', st, re.M)
              if m:
                  stanzas[m.group(1)] = st
          def field(st, f):
              m = re.search(r'^%s: (.+)$' % f, st, re.M)
              return m.group(1) if m else ''
          def deps(st):
              raw = field(st, 'Depends')
              out = []
              for d in raw.split(','):
                  d = re.sub(r'\s*\(.*\)', '', d).strip()
                  d = d.split(':')[0].strip()
                  if d:
                      out.append(d)
              return out
          todo = ['nodejs']
          seen = set()
          order = []
          while todo:
              p = todo.pop(0)
              if not p or p in seen or p not in stanzas:
                  continue
              seen.add(p)
              st = stanzas[p]
              fn = field(st, 'Filename')
              if fn:
                  order.append(fn)
              todo.extend(deps(st))
          print('\n'.join(order))
          PYEOF
          wc -l /tmp/dl_list.txt
          mkdir -p /tmp/tn && cd /tmp/tn
          while IFS= read -r FN; do
            [ -z "$FN" ] && continue
            echo "downloading: $FN"
            curl -sL --retry 3 -o pkg.deb "https://packages.termux.dev/apt/termux-main/$FN"
            D="x_$(echo "$FN" | tr '/' '_')"
            mkdir -p "$D" && cd "$D"
            ar x ../pkg.deb
            if [ -f data.tar.xz ]; then tar -xf data.tar.xz;
            elif [ -f data.tar.zst ]; then tar --zstd -xf data.tar.zst;
            elif [ -f data.tar.gz ]; then tar -xf data.tar.gz; fi
            rm -f ../pkg.deb
            cd ..
          done < /tmp/dl_list.txt

          NODE_BIN=$(find /tmp/tn -path '*files/usr/bin/node' -type f | head -n1)
          echo "node binary: $NODE_BIN"
          cd "$GITHUB_WORKSPACE"
          cp "$NODE_BIN" app/src/main/assets/engine/node
          chmod +x app/src/main/assets/engine/node

          # shared libraries: walk NEEDED entries across ALL extracted packages
          LIBDIR=app/src/main/assets/engine/lib
          mkdir -p "$LIBDIR"
          find /tmp/tn -type d -name lib > /tmp/libdirs.txt
          copy_needed() {
            local bin="$1"
            for lib in $(readelf -d "$bin" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\].*/\1/'); do
              if [ ! -f "$LIBDIR/$lib" ]; then
                src=$(cat /tmp/libdirs.txt | xargs -I{} find {} -name "$lib" 2>/dev/null | head -n1)
                if [ -n "$src" ]; then
                  cp "$src" "$LIBDIR/$lib"
                  echo "$src" >> /tmp/copied.txt
                else
                  echo "WARN: $lib not found"
                fi
              fi
            done
          }
          touch /tmp/copied.txt
          copy_needed app/src/main/assets/engine/node
          # fixed-point: rescan until no new libs appear
          for round in 1 2 3 4 5; do
            before=$(ls "$LIBDIR" | wc -l)
            for f in $(find "$LIBDIR" -type f); do copy_needed "$f"; done
            after=$(ls "$LIBDIR" | wc -l)
            [ "$before" = "$after" ] && break
          done
          ls -la "$LIBDIR"

          # 2) dsh CLI bundle via npm
          mkdir -p app/src/main/assets/engine/bundle
          cd app/src/main/assets/engine/bundle
          npm install @deepseek-ai/dsh --ignore-scripts --omit=dev --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"

          # 3) dsh launcher script
          cat > app/src/main/assets/engine/dsh <<'EOS'
          #!/system/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export HOME="$DIR/home"
          export TMPDIR="$HOME/tmp"
          export OPENSSL_CONF=/dev/null
          mkdir -p "$HOME/tmp"
          exec "$DIR/node" "$DIR/bundle/node_modules/@deepseek-ai/dsh/lib/bin.js" "$@"
          EOS
          chmod +x app/src/main/assets/engine/dsh

      - name: Patch engine native deps for Android
        run: |
          set -e
          NM=app/src/main/assets/engine/bundle/node_modules

          # tolerant proxy stub: any property access/call returns another stub
          write_tolerant_cjs() { cat > "$1" <<'EOF'
          const fn = function stub(){};
          const anything = new Proxy(fn, {
            get(t,p){
              if (p === Symbol.toPrimitive) return function(hint){ return "stub"; };
              if (typeof p === "symbol") return undefined;
              if (p === "then" || p === "__esModule") return undefined;
              return anything;
            },
            apply(){ return anything; },
            construct(){ return anything; }
          });
          module.exports = anything;
          EOF
          }
          write_tolerant_mjs() { cat > "$1" <<'EOF'
          const fn = function stub(){};
          const anything = new Proxy(fn, {
            get(t,p){
              if (p === Symbol.toPrimitive) return function(hint){ return "stub"; };
              if (typeof p === "symbol") return undefined;
              if (p === "then" || p === "__esModule") return undefined;
              return anything;
            },
            apply(){ return anything; },
            construct(){ return anything; }
          });
          export default anything;
          export const proto = anything;
          export const load = anything;
          EOF
          }

          # koffi (FFI, no Android build): stub it out
          mkdir -p "$NM/koffi"
          printf '%s\n' '{"name":"koffi","version":"3.1.6","main":"stub.cjs","exports":{".":{"require":"./stub.cjs","import":"./stub.mjs"}}}' > "$NM/koffi/package.json"
          write_tolerant_cjs "$NM/koffi/stub.cjs"
          write_tolerant_mjs "$NM/koffi/stub.mjs"

          # node-pty (no android-arm64 prebuild): stub it out
          mkdir -p "$NM/node-pty"
          printf '%s\n' '{"name":"node-pty","version":"1.0.0","main":"stub.cjs","exports":{".":{"require":"./stub.cjs","import":"./stub.mjs"}}}' > "$NM/node-pty/package.json"
          write_tolerant_cjs "$NM/node-pty/stub.cjs"
          write_tolerant_mjs "$NM/node-pty/stub.mjs"

          # minimal cordis plugin class stub
          write_class_stub() { cat > "$1" <<'EOF'
          export default class DshPluginStub {
            static inject = []
            static provide = 'sandbox'
            async start() {}
            stop() {}
          }
          EOF
          }

          for P in dsh-sandbox-local dsh-bash-sandbox dsh-permission-presets; do
            DIR="$NM/@deepseek-ai/$P"
            mkdir -p "$DIR"
            printf '%s\n' "{\"name\":\"@deepseek-ai/$P\",\"version\":\"0.1.1-rc.2\",\"type\":\"module\",\"main\":\"stub.mjs\",\"exports\":{\".\":{\"require\":\"./stub.mjs\",\"import\":\"./stub.mjs\",\"default\":\"./stub.mjs\"}}}" > "$DIR/package.json"
            write_class_stub "$DIR/stub.mjs"
          done

          # cordis HMR plugin requires --expose-internals: provide a service-compatible stub
          cat > "$NM/@deepseek-ai/cordis-plugin-hmr/stub.mjs" <<'EOF'
          import { Service } from "@deepseek-ai/cordis";
          export default class CordisHmrStub extends Service {
            static inject = []
            callbacks = new Map()
            constructor(ctx, config) {
              super(ctx, "hmr");
              this.config = config;
            }
            registerConfig(filename, compose) {
              this.callbacks.set(filename, compose)
              return Promise.resolve(async () => {})
            }
            async start() {}
            stop() {}
          }
          EOF
          echo "engine patches applied"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
