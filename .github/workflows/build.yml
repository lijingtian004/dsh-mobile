name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare engine assets
        run: |
          set -ex
          PS4="+ ${BASH_SOURCE}:${LINENO}: "
          mkdir -p app/src/main/assets/engine

          # 1) Native Android ARM64 Node.js from the official Termux repo
          curl -s -o /tmp/Packages \
            https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages

          mkdir -p /tmp/tn && cd /tmp/tn
          declare -A DONE
          queue=(nodejs)
          while [ ${#queue[@]} -gt 0 ]; do
            p="${queue[0]}"; queue=("${queue[@]:1}")
            [ -z "$p" ] && continue
            [ -n "${DONE[$p]}" ] && continue
            DONE[$p]=1
            STANZA=$(awk -v RS='' -v P="$p" '{
                n = split($0, lines, "\n")
                for (i = 1; i <= n; i++)
                  if (lines[i] == "Package: " P) { print; exit }
              }' /tmp/Packages | tail -n1)
            [ -z "$STANZA" ] && { echo "skip unknown package: $p"; continue; }
            FN=$(echo "$STANZA" | grep -m1 '^Filename:' | cut -d' ' -f2)
            DEPS=$(echo "$STANZA" | grep -m1 '^Depends:' | sed 's/^Depends: //' | tr ',' '\n' | sed 's/([^)]*)//g' | awk '{print $1}' | sed 's/:.*$//' | grep -v '^$' || true)
            for d in $DEPS; do [ -z "${DONE[$d]}" ] && queue+=("$d"); done
            echo "downloading: $FN"
            curl -sL --retry 3 -o "pkg.deb" "https://packages.termux.dev/apt/termux-main/$FN"
            mkdir -p "x_$p" && cd "x_$p"
            ar x ../pkg.deb
            if [ -f data.tar.xz ]; then tar -xf data.tar.xz;
            elif [ -f data.tar.zst ]; then tar --zstd -xf data.tar.zst;
            elif [ -f data.tar.gz ]; then tar -xf data.tar.gz; fi
            rm -f ../pkg.deb
            cd ..
          done

          NODE_BIN=$(find /tmp/tn -path '*files/usr/bin/node' -type f | head -n1)
          echo "node binary: $NODE_BIN"
          cd "$GITHUB_WORKSPACE"
          cp "$NODE_BIN" app/src/main/assets/engine/node
          chmod +x app/src/main/assets/engine/node

          # shared libraries: walk NEEDED entries across ALL extracted packages
          LIBDIR=app/src/main/assets/engine/lib
          mkdir -p "$LIBDIR"
          find /tmp/tn -type d -name lib > /tmp/libdirs.txt
          copy_needed() {
            local bin="$1"
            for lib in $(readelf -d "$bin" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\].*/\1/'); do
              if [ ! -f "$LIBDIR/$lib" ]; then
                src=$(cat /tmp/libdirs.txt | xargs -I{} find {} -name "$lib" 2>/dev/null | head -n1)
                if [ -n "$src" ]; then
                  cp "$src" "$LIBDIR/$lib"
                  echo "$src" >> /tmp/copied.txt
                else
                  echo "WARN: $lib not found"
                fi
              fi
            done
          }
          touch /tmp/copied.txt
          copy_needed app/src/main/assets/engine/node
          # fixed-point: rescan until no new libs appear
          for round in 1 2 3 4 5; do
            before=$(ls "$LIBDIR" | wc -l)
            for f in $(find "$LIBDIR" -type f); do copy_needed "$f"; done
            after=$(ls "$LIBDIR" | wc -l)
            [ "$before" = "$after" ] && break
          done
          ls -la "$LIBDIR"

          # 2) dsh CLI bundle via npm
          mkdir -p app/src/main/assets/engine/bundle
          cd app/src/main/assets/engine/bundle
          npm install @deepseek-ai/dsh --ignore-scripts --omit=dev --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"

          # 3) dsh launcher script
          cat > app/src/main/assets/engine/dsh <<'EOS'
          #!/system/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export HOME="$DIR/home"
          export TMPDIR="$HOME/tmp"
          mkdir -p "$HOME/tmp"
          exec "$DIR/node" "$DIR/bundle/node_modules/@deepseek-ai/dsh/lib/bin.js" "$@"
          EOS
          chmod +x app/src/main/assets/engine/dsh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
