name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare engine assets
        run: |
          set -e
          mkdir -p app/src/main/assets/engine

          # 1) Native Android ARM64 Node.js from the official Termux repo
          curl -s -o /tmp/Packages \
            https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages
          FILE_PATH=$(grep -A15 '^Package: nodejs$' /tmp/Packages | grep '^Filename:' | tail -n1 | cut -d' ' -f2)
          echo "termux nodejs package: $FILE_PATH"
          curl -sL --retry 3 -o /tmp/node.deb "https://packages.termux.dev/$FILE_PATH"
          mkdir -p /tmp/tn && cd /tmp/tn
          ar x /tmp/node.deb
          if [ -f data.tar.xz ]; then tar -xf data.tar.xz;
          elif [ -f data.tar.zst ]; then tar --zstd -xf data.tar.zst;
          elif [ -f data.tar.gz ]; then tar -xf data.tar.gz; fi
          USR=/tmp/tn/data/data/com.termux/files/usr
          cd "$GITHUB_WORKSPACE"
          cp "$USR/bin/node" app/src/main/assets/engine/node
          chmod +x app/src/main/assets/engine/node

          # shared libraries (two passes to catch transitive deps)
          LIBDIR=app/src/main/assets/engine/lib
          mkdir -p "$LIBDIR"
          copy_needed() {
            local bin="$1"
            for lib in $(readelf -d "$bin" | grep NEEDED | sed 's/.*\[\(.*\)\].*/\1/'); do
              if [ ! -f "$LIBDIR/$lib" ]; then
                src=$(find "$USR/lib" -name "$lib" | head -n1)
                if [ -n "$src" ]; then
                  cp "$src" "$LIBDIR/$lib"
                  echo "$LIBDIR/$lib" >> /tmp/copied.txt
                fi
              fi
            done
          }
          touch /tmp/copied.txt
          copy_needed "$USR/bin/node"
          while read -r f; do copy_needed "$f"; done < /tmp/copied.txt
          ls -la "$LIBDIR"

          # 2) dsh CLI bundle via npm
          mkdir -p app/src/main/assets/engine/bundle
          cd app/src/main/assets/engine/bundle
          npm install @deepseek-ai/dsh --ignore-scripts --omit=dev --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"

          # 3) dsh launcher script
          cat > app/src/main/assets/engine/dsh <<'EOS'
          #!/system/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export HOME="$DIR/home"
          export TMPDIR="$HOME/tmp"
          mkdir -p "$HOME/tmp"
          exec "$DIR/node" "$DIR/bundle/node_modules/@deepseek-ai/dsh/lib/bin.js" "$@"
          EOS
          chmod +x app/src/main/assets/engine/dsh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
